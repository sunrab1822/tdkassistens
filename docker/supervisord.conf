[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:ollama]
command=ollama serve
priority=10
autorestart=true
environment=OLLAMA_MODELS="/data/ollama/models",OLLAMA_HOST="127.0.0.1:11434"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ollama-models]
command=/docker/pull-models.sh
priority=20
autorestart=false
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:rag]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app/rag
user=www-data
priority=30
autorestart=true
environment=CHROMA_DATA_DIR="/data/chroma",TESSERACT_CMD="tesseract",OLLAMA_BASE_URL="http://127.0.0.1:11434/v1",HF_HOME="/opt/hf-home"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=50
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
